<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="open-flapping-airplanes: one kernel, three programs">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#27c8e8"/><stop offset=".55" stop-color="#ff5757"/><stop offset="1" stop-color="#f2c14e"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#27c8e8" stop-opacity=".45"/><stop offset="1" stop-color="#27c8e8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1d2633" stroke-width="1" opacity=".5"/></pattern>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#27c8e8" stop-opacity="0"/><stop offset=".5" stop-color="#27c8e8" stop-opacity=".55"/><stop offset="1" stop-color="#27c8e8" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1200" height="360" fill="#07090d"/><rect width="1200" height="360" fill="url(#grid)"/>
<rect y="0" width="260" height="360" fill="url(#sweep)" opacity=".5"><animateTransform attributeName="transform" type="translate" from="-300 0" to="1300 0" dur="7s" repeatCount="indefinite"/></rect>
<text x="64" y="188" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800" font-size="150" letter-spacing="-4" fill="url(#g)">OFA</text>
<text x="70" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" fill="#d6dee8">one kernel <tspan fill="#7a8798">·</tspan> three programs</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">
<text x="70" y="288" fill="#27c8e8">● train</text><text x="188" y="288" fill="#ff5757">● serve</text><text x="306" y="288" fill="#f2c14e">● play Doom</text>
<text x="70" y="318" fill="#7a8798">all at once, in a single GPU launch</text></g>
<circle cx="930" cy="180" r="150" fill="url(#glow)"><animate attributeName="r" values="130;165;130" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="930" cy="180" r="70" fill="none" stroke="#27c8e8" stroke-opacity=".18" stroke-dasharray="3 7"/><circle r="7" fill="#27c8e8"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M 930,110 A 70,70 0 1,1 929.99,110"/><animate attributeName="r" values="7;10;7" dur="2s" repeatCount="indefinite"/></circle><circle r="18.2" fill="#27c8e8" opacity=".16"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M 930,110 A 70,70 0 1,1 929.99,110"/></circle><circle cx="930" cy="180" r="108" fill="none" stroke="#ff5757" stroke-opacity=".18" stroke-dasharray="3 7"/><circle r="7" fill="#ff5757"><animateMotion dur="7s" begin="-2.3s" repeatCount="indefinite" path="M 930,72 A 108,108 0 1,1 929.99,72"/><animate attributeName="r" values="7;10;7" dur="2s" repeatCount="indefinite"/></circle><circle r="18.2" fill="#ff5757" opacity=".16"><animateMotion dur="7s" begin="-2.3s" repeatCount="indefinite" path="M 930,72 A 108,108 0 1,1 929.99,72"/></circle><circle cx="930" cy="180" r="146" fill="none" stroke="#f2c14e" stroke-opacity=".18" stroke-dasharray="3 7"/><circle r="7" fill="#f2c14e"><animateMotion dur="10s" begin="-5.1s" repeatCount="indefinite" path="M 930,34 A 146,146 0 1,1 929.99,34"/><animate attributeName="r" values="7;10;7" dur="2s" repeatCount="indefinite"/></circle><circle r="18.2" fill="#f2c14e" opacity=".16"><animateMotion dur="10s" begin="-5.1s" repeatCount="indefinite" path="M 930,34 A 146,146 0 1,1 929.99,34"/></circle>
<rect x="892" y="142" width="76" height="76" rx="14" fill="#0d121a" stroke="url(#g)" stroke-width="2.5"><animate attributeName="stroke-width" values="2.5;5;2.5" dur="2.4s" repeatCount="indefinite"/></rect>
<text x="930" y="184" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="30" fill="#fff">1</text>
<text x="930" y="204" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7a8798">launch</text>
</svg>